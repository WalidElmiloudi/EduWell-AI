services:
  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    container_name: eduwell_streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./src:/app/src
      - ./app:/app/app

  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: eduwell_airflow
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - _AIRFLOW_WWW_USER_FIRSTNAME=Student
      - _AIRFLOW_WWW_USER_LASTNAME=Developer
      - _AIRFLOW_WWW_USER_EMAIL=student@eduwell.ai
      - PYTHONPATH=/opt/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./reports:/opt/airflow/reports
      - ./src:/opt/airflow/src
    command: standalone

